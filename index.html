<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Music Player Interface with HTML &amp; CSS 🎵 | Modern UI Design</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
<div class="music-player">
  <div class="player-top">
    <span class="player-label">NOW PLAYING</span>
    <button class="more-button" type="button" aria-label="More options">⋮</button>
  </div>

  <div class="album-art">
    <div class="album-disc"></div>
    <span>♪</span>
  </div>

  <div class="song-info">
    <h1>Midnight Drive</h1>
    <p>Neon Avenue</p>
  </div>

  <div class="progress-area">
    <div class="progress-track">
      <span class="progress-value"></span>
    </div>

    <div class="time-row">
      <span>1:42</span>
      <span>3:48</span>
    </div>
  </div>

  <div class="player-controls">
    <button type="button" aria-label="Shuffle">⤨</button>
    <button type="button" aria-label="Previous">◀</button>
    <button class="play-button" type="button" aria-label="Play">▶</button>
    <button type="button" aria-label="Next">▶</button>
    <button type="button" aria-label="Repeat">↻</button>
  </div>

  <div class="volume-control">
    <span>🔈</span>
    <div class="volume-track">
      <span class="volume-value"></span>
    </div>
    <span>🔊</span>
  </div>
</div>
</body>
</html>
